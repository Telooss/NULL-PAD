[package]
name = "nullctl"
version = "0.1.1"
edition = "2021"
description = "Interface NULL/CONTROL du macropad NULL/PAD"

[lib]
name = "nullctl_lib"
path = "src/lib.rs"

[[bin]]
name = "nullctl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
prost-build = "0.14"
protoc-bin-vendored = "3.3"

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }
prost = "0.14"
serialport = "4.10"
tauri-plugin-updater = "~2.14.1" # configure_client expose reqwest : version mineure figee
