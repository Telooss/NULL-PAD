[package]
name = "nullctl"
version = "0.1.0"
edition = "2021"
description = "Interface NULL/CONTROL du macropad NULL/PAD"

[lib]
name = "nullctl_lib"
path = "src/lib.rs"

[[bin]]
name = "nullctl"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7"

[dependencies]
tauri = "2.12"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
engine = { path = "../engine" }
serde_json = "1"
tracing = "0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
